camera:
  index: 0
  width: 1280
  height: 720
  expected_fps: 20
  processing_mirror: false
face:
  backend: onnx
  detector_model: face_detection_yunet_2023mar.onnx
  landmark_model: face_landmark_468.onnx
  min_detection_confidence: 0.50
  min_landmark_confidence: 0.50
  nms_threshold: 0.30
  top_k: 5000
  roi_scale: 1.50
  roi_vertical_shift: -0.05
  # One thread is faster and much more stable than ORT auto-threading when
  # C1 PyTorch/OpenCV runs in parallel on the same CPU.
  intra_op_num_threads: 1
eye:
  calibration_seconds: 5
  closure_threshold_ratio: 0.72
  closure_ratio_enter: 0.80
  closure_ratio_exit: 0.55
  microsleep_min_ms: 1000
  microsleep_max_ms: 3000
  sleep_min_ms: 3000
mouth:
  yawn_min_ms: 1500
  yawn_strong_ms: 2000
attention:
  long_glance_ms: 3000
  vats_window_ms: 30000
  vats_trigger_ms: 10000
  candidate_yaw_deg: 20
  candidate_pitch_deg: 15
quality:
  unknown_after_ms: 500
smoothing:
  primitive_median_window_frames: 3
batch:
  # Starter Kit labels describe a sustained clip state rather than only the
  # exact frames where an eye/mouth event peaks.
  segment_seconds: 15
  microsleep_median_ear_max: 0.10
  microsleep_closed_fraction_min: 0.45
  yawn_median_mar_min: 0.30
  yawn_upper_quartile_mar_min: 0.34
  drowsy_closed_fraction_min: 0.10
  drowsy_ear_q10_max: 0.14
  distracted_median_mar_min: 0.205

ml:
  architecture: legacy_5class
  feature_schema: legacy_59

hand:
  # Disabled for the rollback production model.
  # The current Challenge-2 artifact is a legacy Random Forest with 59
  # face/eye/mouth/head-pose rolling features, so hand-derived features are
  # intentionally not part of inference.
  enabled: false
  palm_model: palm_detection_lite.onnx
  landmark_model: hand_landmark_lite.onnx
  inference_interval_frames: 3
  max_stale_frames: 6
  min_detection_confidence: 0.50
  min_landmark_confidence: 0.50
  intra_op_num_threads: 1
  motion_active_threshold: 0.15
  missing_distance_value: 2.0
  near_mouth_norm_threshold: 0.45
  near_ear_norm_threshold: 0.45
  near_face_norm_threshold: 0.70
